<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Ilustración de desarrollo de software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1fb"/>
      <stop offset="1" stop-color="#f7f9fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0056b3"/>
      <stop offset="1" stop-color="#003f87"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="220" fill="#0056b3" opacity="0.06"/>
  <circle cx="120" cy="700" r="180" fill="#0056b3" opacity="0.05"/>
  <!-- Monitor -->
  <rect x="330" y="210" width="540" height="360" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="330" y="210" width="540" height="52" rx="18" fill="#0056b3" opacity="0.12"/>
  <circle cx="360" cy="236" r="6" fill="#0056b3"/>
  <circle cx="384" cy="236" r="6" fill="#acc7ff"/>
  <circle cx="408" cy="236" r="6" fill="#cbd5e1"/>
  <!-- Code lines -->
  <g font-family="Menlo, Consolas, monospace" font-size="20" fill="#64748b">
    <rect x="380" y="300" width="440" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="380" y="340" width="360" height="18" rx="9" fill="#dbeafe"/>
    <rect x="380" y="380" width="420" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="380" y="420" width="300" height="18" rx="9" fill="#dbeafe"/>
    <rect x="380" y="460" width="380" height="18" rx="9" fill="#e2e8f0"/>
  </g>
  <!-- Accents -->
  <rect x="300" y="600" width="600" height="14" rx="7" fill="#cbd5e1" opacity="0.6"/>
  <rect x="380" y="630" width="440" height="10" rx="5" fill="#e2e8f0"/>
  <!-- Floating chips -->
  <g font-family="Inter, Arial, sans-serif" font-weight="600" font-size="16" fill="#003f87">
    <rect x="180" y="180" width="150" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="255" y="208" text-anchor="middle">&#60;/&#62; PHP 8.2</text>
    <rect x="880" y="320" width="150" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="955" y="348" text-anchor="middle">WordPress 7</text>
  </g>
  <!-- Sparkles -->
  <g fill="#0056b3">
    <path d="M760 120 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z" opacity="0.5"/>
    <path d="M360 620 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z" opacity="0.4"/>
  </g>
</svg>
