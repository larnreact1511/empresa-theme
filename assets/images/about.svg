<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Ilustración de colaboración en equipo">
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="aboutBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0056b3"/>
      <stop offset="1" stop-color="#003f87"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aboutBg)"/>
  <circle cx="700" cy="90" r="150" fill="#0056b3" opacity="0.06"/>
  <circle cx="90" cy="520" r="120" fill="#0056b3" opacity="0.05"/>
  <!-- Table -->
  <rect x="140" y="330" width="520" height="20" rx="10" fill="#cbd5e1" opacity="0.7"/>
  <rect x="200" y="350" width="24" height="140" rx="6" fill="#cbd5e1"/>
  <rect x="576" y="350" width="24" height="140" rx="6" fill="#cbd5e1"/>
  <!-- People -->
  <g>
    <circle cx="280" cy="240" r="52" fill="url(#aboutBrand)"/>
    <rect x="230" y="290" width="100" height="130" rx="30" fill="#0056b3" opacity="0.85"/>
  </g>
  <g>
    <circle cx="420" cy="220" r="48" fill="#acc7ff"/>
    <rect x="374" y="268" width="92" height="120" rx="28" fill="#acc7ff"/>
  </g>
  <g>
    <circle cx="550" cy="250" r="50" fill="url(#aboutBrand)"/>
    <rect x="502" y="300" width="96" height="120" rx="28" fill="#0056b3" opacity="0.85"/>
  </g>
  <!-- Laptop -->
  <rect x="360" y="300" width="120" height="80" rx="8" fill="#1e293b"/>
  <rect x="372" y="312" width="96" height="56" rx="4" fill="#dbeafe"/>
  <!-- Speech bubbles -->
  <g fill="#0056b3" opacity="0.85">
    <rect x="180" y="150" width="120" height="40" rx="20"/>
    <rect x="500" y="120" width="120" height="40" rx="20"/>
  </g>
  <g fill="#ffffff" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="16">
    <text x="240" y="176" text-anchor="middle">Ideas</text>
    <text x="560" y="146" text-anchor="middle">Código</text>
  </g>
</svg>
